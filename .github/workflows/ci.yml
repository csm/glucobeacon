name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  embedded:
    name: no_std cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2

      # Everything that will run on the ESP32 gets built for a target with no
      # std, which is the only way to keep it true.
      #
      # riscv32imc rather than an Xtensa target: Xtensa needs the esp-rs
      # toolchain fork, which stock rustup cannot install, and riscv32imc is
      # the stricter check anyway — it has no atomic compare-and-swap, so
      # anything that quietly depends on one fails here rather than on the
      # bench.
      - name: Build the device crates without std
        run: |
          cargo build \
            -p glucobeacon-core -p glucobeacon-proto -p glucobeacon-display \
            --no-default-features --target riscv32imc-unknown-none-elf

      # The gateway's Dexcom client must not require reqwest: an ESP-IDF build
      # uses the HTTP client ESP-IDF already links, rather than a second TLS
      # stack.
      - name: Build the Dexcom client without reqwest
        run: cargo build -p glucobeacon-dexcom --no-default-features

  xtensa:
    name: ESP32-S3 cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ESP32-S3 is Xtensa, which stock rustup cannot install.
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: false
          version: nightly
      - uses: Swatinem/rust-cache@v2

      # The actual shipping target, not a proxy for it.
      - name: Build the device crates for xtensa-esp32s3-none-elf
        run: |
          cargo build -Z build-std=core \
            -p glucobeacon-core -p glucobeacon-proto -p glucobeacon-display \
            --no-default-features --target xtensa-esp32s3-none-elf
