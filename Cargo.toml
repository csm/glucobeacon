[workspace]
resolver = "3"
members = ["crates/*"]
# The firmware needs the Xtensa toolchain and a device target, so it is its own
# workspace: building from the root must not require espup.
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/csm/glucobeacon"
authors = ["glucobeacon contributors"]

[workspace.dependencies]
glucobeacon-core = { path = "crates/glucobeacon-core", version = "0.1.0", default-features = false }
glucobeacon-proto = { path = "crates/glucobeacon-proto", version = "0.1.0", default-features = false }
glucobeacon-dexcom = { path = "crates/glucobeacon-dexcom", version = "0.1.0" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
