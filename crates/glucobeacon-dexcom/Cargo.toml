[package]
name = "glucobeacon-dexcom"
description = "Dexcom Share API client for the glucobeacon gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
glucobeacon-core = { version = "0.1.0", path = "../glucobeacon-core", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "query", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false, features = ["time", "macros", "rt"] }
tracing = "0.1.44"

[lints]
workspace = true
