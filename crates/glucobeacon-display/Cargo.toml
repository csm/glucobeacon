[package]
name = "glucobeacon-display"
description = "Display-side glucobeacon node: e-ink panel, buzzer, and silence button"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
embedded-graphics = "0.8.2"
glucobeacon-core = { version = "0.1.0", path = "../glucobeacon-core" }
glucobeacon-proto = { version = "0.1.0", path = "../glucobeacon-proto", features = ["udp-link"] }
heapless = "0.9.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
