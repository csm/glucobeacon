[package]
name = "glucobeacon-proto"
description = "LoRa wire protocol shared by the glucobeacon gateway and display nodes (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
crc = { version = "3.4.0", default-features = false }
glucobeacon-core = { workspace = true, features = ["serde"] }
postcard = { version = "1.1.3", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }

[features]
default = ["std"]
std = ["glucobeacon-core/std", "postcard/use-std", "serde/std"]
# A UDP-backed `Link` implementation, used to run the two ends on one dev box
# without any radio hardware.
udp-link = ["std"]

[lints]
workspace = true
