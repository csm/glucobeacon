# Its own workspace: this crate builds only under the Xtensa toolchain.
[workspace]

[package]
name = "glucobeacon-fw-display"
description = "Display-node firmware for the Heltec WiFi LoRa 32 V3"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Everything with logic in it lives in the workspace, is tested on the host,
# and is verified to compile for xtensa-esp32s3-none-elf. This crate is wiring.
glucobeacon-core = { path = "../../crates/glucobeacon-core", default-features = false }
glucobeacon-proto = { path = "../../crates/glucobeacon-proto", default-features = false }
glucobeacon-display = { path = "../../crates/glucobeacon-display", default-features = false, features = [
  "embedded",
] }

embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"

esp-hal = { version = "1.0", features = ["esp32s3", "unstable"] }
esp-backtrace = { version = "0.17", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.15", features = ["esp32s3", "log-04"] }
log = "0.4"
static_cell = "2.1"

# SX1262 driver. Covers the SX126x family behind one API.
lora-phy = "3.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2          # kept: it costs flash, not RAM, and makes panics readable
overflow-checks = false

[profile.dev]
opt-level = 1      # an unoptimised esp-hal build is too slow to be useful
